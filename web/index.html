<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>peruse</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
  <link rel="stylesheet" href="/catppuccin.css">
  <link rel="stylesheet" href="/diff2html.min.css">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body x-data="peruse" x-cloak>
  <header>
    <a class="brand" href="/">peruse</a>
    <select class="project-switcher" x-show="projectName"
            @change="switchProject($event.target.value)" aria-label="Switch project">
      <template x-for="project in registeredProjects" :key="project.routeName">
        <optgroup :label="project.name">
          <option :value="project.routeName" :selected="project.routeName === projectName"
                  :disabled="project.missing"
                  x-text="project.name"></option>
          <template x-for="worktree in worktreesFor(project)" :key="worktree.routeName">
            <option :value="worktree.routeName" :selected="worktree.routeName === projectName"
                    :disabled="worktree.missing"
                    x-text="`↳ ${worktree.name}`"></option>
          </template>
        </optgroup>
      </template>
    </select>
    <span class="root" x-show="projectName" x-text="rootLabel" :title="root"></span>
    <span class="spacer"></span>
    <label class="toggle" x-show="projectName && isRepo">
      <input type="checkbox" x-model="changedOnly"> changed only
    </label>
    <button type="button" class="chip" x-show="projectName" @click="showIgnored = !showIgnored"
            x-text="showIgnored ? 'hide ignored' : 'show ignored'"></button>
    <button type="button" class="chip theme-btn" @click="toggleTheme()"
            x-text="theme === 'mocha' ? '☀' : '☾'" title="Toggle theme"></button>
  </header>

  <section class="landing" x-show="!projectName">
    <div class="landing-intro">
      <p class="eyebrow">Project library</p>
      <h1>What would you like to peruse?</h1>
      <p>Projects you open with <code>peruse &lt;path&gt;</code> appear here automatically.</p>
    </div>
    <div class="project-list">
      <template x-for="project in registeredProjects" :key="project.routeName">
        <article class="project-card" :class="{ missing: project.missing }">
          <a href="/" :href="project.missing ? '/' : projectHref(project.routeName)"
             @click="project.missing && $event.preventDefault()" class="project-primary">
            <span class="project-name" x-text="project.name">Project</span>
            <span class="project-summary" x-text="summaryLabel(project)"></span>
            <span class="project-path" x-text="project.path"></span>
            <span class="project-opened" x-text="`opened ${formatOpened(project.lastOpened)}`"></span>
          </a>
          <div class="worktree-list" x-show="worktreesFor(project).length">
            <template x-for="worktree in worktreesFor(project)" :key="worktree.routeName">
              <a class="worktree-row" href="/" :href="projectHref(worktree.routeName)">
                <span x-text="worktree.name">Worktree</span>
                <span x-text="summaryLabel(worktree)"></span>
                <span x-text="worktree.path"></span>
              </a>
            </template>
          </div>
        </article>
      </template>
      <div class="landing-empty" x-show="registeredProjects.length === 0">
        No projects yet. Run <code>peruse &lt;path&gt;</code> or <code>peruse add &lt;path&gt;</code>.
      </div>
    </div>
  </section>

  <main x-show="projectName">
    <nav id="tree">
      <template x-for="row in rows" :key="row.path">
        <div class="row"
             :class="{ selected: row.path === file?.path, dim: row.ignored, truncated: row.truncated }"
             :style="`--depth: ${row.depth}`"
             @click="rowClick(row)">
          <span class="twist"
                :class="{ open: row.dir && (changedOnly || open.has(row.path)) }"
                x-text="row.dir && row.children?.length ? '▸' : ''"></span>
          <span class="tree-icon" x-show="!row.truncated"
                :class="row.dir ? 'i-folder' : 'i-file'"></span>
          <span class="name" x-text="row.name"></span>
          <span class="status" x-show="row.status" :data-s="row.status" x-text="row.status"></span>
          <span class="dirty-dot" x-show="row.dir && row.dirty" title="contains changes"></span>
        </div>
      </template>
      <div class="tree-empty" x-show="rows.length === 0">no files</div>
    </nav>

    <section id="pane">
      <div id="pane-header" x-show="file">
        <span class="path" x-text="file?.path"></span>
        <span class="status" x-show="file?.status" :data-s="file?.status" x-text="file?.status"></span>
        <span class="spacer"></span>
        <span class="chip chip-group" x-show="reviewable.length">
          <button type="button" class="chip-arrow" @click="cycleHunk(-1)" title="Previous change">‹</button>
          <span x-text="hunkChip"></span>
          <button type="button" class="chip-arrow" @click="cycleHunk(1)" title="Next change">›</button>
        </span>
        <button type="button" class="chip" x-show="isMarkdown && !file?.binary" @click="raw = !raw"
                x-text="raw ? 'Rendered' : 'Raw'"></button>
        <button type="button" class="chip wrap-btn" x-show="wrapAvailable" @click="toggleWrap()"
                x-text="wrap ? 'No wrap' : 'Wrap'" title="Toggle word wrap"></button>
      </div>
      <div id="viewer-scroll" x-ref="scroll">
        <div class="render-wait" x-show="loading" x-cloak>
          <span class="spin"></span> rendering <span x-text="loadingName"></span>…
        </div>
        <div id="viewer" x-ref="viewer" :data-wrap="wrap ? '' : null"></div>
        <div class="placeholder" x-show="!file && !loading">select a file</div>
      </div>
    </section>
  </main>
</body>
</html>
