name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test

  publish:
    needs: gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing (provenance automatic)
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing requires npm >= 11.5.1; move to whatever is current.
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      # Idempotency: the bootstrap release is published manually before the
      # trusted publisher can be configured (npm only offers the settings on
      # an existing package), and reruns must not fail on "cannot publish
      # over". prepublishOnly runs `bun run build`.
      - name: Publish unless this version already exists
        run: |
          version="$(npm pkg get version | tr -d '"')"
          name="$(npm pkg get name | tr -d '"')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag_version" ]; then
            echo "::error::package.json version $version does not match tag $GITHUB_REF_NAME"
            exit 1
          fi
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version already on the registry — skipping publish"
          else
            npm publish
          fi

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Extract this version's changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if ! [ -s release-notes.md ]; then
            echo "::error::no CHANGELOG.md section found for [$version]"
            exit 1
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
