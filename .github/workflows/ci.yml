name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
      - name: Unit + integration tests
        run: bun test test/unit test/integration
      - name: Install Chromium for E2E
        # playwright (full) installs into the shared registry that
        # playwright-core resolves from; versions must stay in lockstep
        # with the playwright-core devDependency.
        run: bunx playwright@1.61.1 install --with-deps chromium
      - name: E2E tests
        run: bun test test/e2e
